# The whole run. `restart: always` on the long-lived services plus the VM's own
# auto-restart means the researcher's laptop is never in the loop once this is up.
#
# One orchestrator per experiment cell. They are independent -- separate run_ids,
# separate work-unit queues, separate AIMD limiters that each discover their own
# share of the throughput ceiling -- so cells run concurrently and a stall in one
# cannot hold up another.
#
# Generation t2. The t1 cells ran with a 512-token output budget, which was
# clipping the model's reasoning: the thought-token histogram piled up against
# the ceiling and traces ended mid-sentence. How long the model may think is a
# treatment, not a logging detail, so the cells were re-run rather than continued
# under a changed budget. The t1 rows are kept and stay readable in the
# dashboard; nothing was deleted to make room for these.
x-cell: &cell
  build:
    context: ..
    dockerfile: infra/Dockerfile
  # NOT `always`: a cell that has played all its episodes exits 0 and is done.
  # Restarting it forever would spin the whole stack on a finished experiment.
  restart: on-failure
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - /run/secrets:/run/secrets:ro
  command: ["python", "-m", "horizon.runner.orchestrator"]

x-cell-env: &cell-env
  HORIZON_DSN: postgresql://horizon:${POSTGRES_PASSWORD}@postgres:5432/horizon
  HORIZON_PROJECT: ${HORIZON_PROJECT}
  HORIZON_SA_KEY: /run/secrets/sa-key.json
  HORIZON_WORKERS: ${HORIZON_WORKERS:-24}
  HORIZON_EPISODES: ${HORIZON_EPISODES:-200}
  HORIZON_MAX_OUTPUT: ${HORIZON_MAX_OUTPUT:-4096}

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: horizon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon"]
      interval: 5s
      timeout: 5s
      retries: 20

  # T1.1 -- uniform exit, distribution known. The reference cell.
  cell-uniform:
    <<: *cell
    environment:
      <<: *cell-env
      HORIZON_RUN_ID: t2-1
      HORIZON_EXIT: uniform
      HORIZON_INFO: K

  # T1.2 -- bimodal exit. The hazard has a bright line at day 10; whether the
  # agent's behaviour has one too is the sharpest single test in the study.
  cell-bimodal:
    <<: *cell
    environment:
      <<: *cell-env
      HORIZON_RUN_ID: t2-2
      HORIZON_EXIT: bimodal
      HORIZON_INFO: K

  # T1.3 -- geometric exit. Memoryless, so the optimal policy is very nearly
  # time-invariant. An agent that still shifts its behaviour with the clock here
  # is responding to elapsed time itself rather than to the horizon.
  cell-geometric:
    <<: *cell
    environment:
      <<: *cell-env
      HORIZON_RUN_ID: t2-3
      HORIZON_EXIT: geometric
      HORIZON_INFO: K

  # T1.4 -- uniform exit, distribution withheld. Separates failing to know the
  # horizon from failing to act on it.
  cell-unknown:
    <<: *cell
    environment:
      <<: *cell-env
      HORIZON_RUN_ID: t2-4
      HORIZON_EXIT: uniform
      HORIZON_INFO: U

  # T1.5 -- oracle. The true exit day is stated outright, which removes the
  # inference problem entirely and upper-bounds what the prompt can achieve.
  cell-oracle:
    <<: *cell
    environment:
      <<: *cell-env
      HORIZON_RUN_ID: t2-5
      HORIZON_EXIT: uniform
      HORIZON_INFO: O

  dashboard:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HORIZON_DSN: postgresql://horizon:${POSTGRES_PASSWORD}@postgres:5432/horizon
      # Which cell opens by default. Every other cell is one click away.
      HORIZON_RUN_ID: ${HORIZON_DASHBOARD_RUN:-t2-1}
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - dashboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  caddydata:
  caddyconfig:
