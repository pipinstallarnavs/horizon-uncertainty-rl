[project]
name = "horizon"
version = "0.1.0"
description = "Random-horizon trading: testing temporal reasoning in LLM agents"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "requests>=2.31",
    "google-auth>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "httpx>=0.27"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["horizon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
